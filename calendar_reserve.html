<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カレンダー予約ツール</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; font-size: 13px; color: #333; }
    .nav { margin-bottom: 10px; }
    .nav a { text-decoration: none; color: #007bff; font-weight: bold; }
    .container { max-width: 950px; margin: 0 auto; display: flex; gap: 15px; }
    .panel { flex: 1; border: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; min-width: 0; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .btn-small { cursor: pointer; font-size: 10px; padding: 2px 5px; background: #eee; border: 1px solid #ccc; border-radius: 3px; }
    .label { font-weight: bold; display: block; margin-top: 10px; }
    select, textarea, input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; border: 1px solid #999; font-size: 14px; }
    #rawInput { height: 120px; }
    #resultOutput { flex-grow: 1; height: 250px; background: #fff; font-family: monospace; }
    #threadOutput { height: 100px; background: #fff; font-family: monospace; }
    .flex-row { display: flex; gap: 5px; margin-top: 4px; }
    .flex-row input { flex: 1; }
    .btn-copy { cursor: pointer; padding: 5px 10px; background: #eee; border: 1px solid #999; font-size: 11px; white-space: nowrap; border-radius: 3px; }
    .btn-main { cursor: pointer; padding: 12px; width: 100%; margin-top: 10px; background: #333; color: #fff; border: none; font-weight: bold; border-radius: 4px; }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }
    .hidden { display: none !important; }
    @media (max-width: 700px) { .container { flex-direction: column; } }
  </style>
</head>
<body>

<div class="nav"><a href="index.html">← インデックスに戻る</a></div>

<div class="container">
  <div class="panel">
    <div class="header-row"><strong>【入力エリア】</strong><button class="btn-small" onclick="location.reload()">リセット</button></div>
    <span class="label">1. テンプレート選択</span>
    <select id="tplSelect" onchange="setupCalTitleSelect(); update();"><option value="">読込中...</option></select>
    <span class="label">2. 申し込み情報</span>
    <textarea id="rawInput" oninput="update()" placeholder="ここに貼り付け"></textarea>
    <div class="flex-row" style="justify-content: flex-end;"><button class="btn-copy" onclick="copyText('rawInput')">申し込み情報をコピー</button></div>
    <span class="label">3. お客様LINE名 (必須)</span>
    <input type="text" id="lineNameInput" oninput="update()" placeholder="例：田中太郎">
    <span class="label">4. セールス担当</span>
    <select id="staffSelect" onchange="update()"></select>
  </div>

  <div class="panel">
    <strong>【出力結果】</strong>
    <div id="calBox" class="hidden">
      <span class="label">カレンダータイトル種別</span>
      <select id="calTitleSelect" onchange="update()"></select>
      <span class="label">コピー用タイトル</span>
      <div class="flex-row"><input type="text" id="calOutput"><button class="btn-copy" onclick="copyText('calOutput')">コピー</button></div>
    </div>

    <div id="threadBox" class="hidden">
      <span class="label">スレッド用テキスト（編集可）</span>
      <textarea id="threadOutput"></textarea>
      <div class="flex-row" style="justify-content: flex-end;"><button class="btn-copy" onclick="copyText('threadOutput')">スレッドをコピー</button></div>
    </div>

    <span class="label">生成された本文（編集可）</span>
    <textarea id="resultOutput"></textarea>
    <button id="mainCopyBtn" class="btn-main" onclick="copyText('resultOutput')" disabled>本文をコピーする</button>
  </div>
</div>

<script>
  const TPL_API = "https://script.google.com/macros/s/AKfycbwknNEj5910zohQL6xzbLnFPj5HqByNODhKvGAAE3yB4lpQ3aIjxVmVa0cmbkTTEk3V/exec";
  const STAFF_API = "https://script.google.com/macros/s/AKfycbySHVscjhTYWKf8bLJUGIMJ7AArbsp8cS8wl0O8FyYjYoO2mRzMO8jZhcc_cmhDvYfIhA/exec";
  let templates = [], staffList = [];

  window.onload = async () => {
    try {
      const [r1, r2] = await Promise.all([fetch(TPL_API).then(r=>r.json()), fetch(STAFF_API).then(r=>r.json())]);
      templates = r1; staffList = r2;
      document.getElementById("tplSelect").innerHTML = '<option value="">選択</option>' + templates.map((t,i)=>`<option value="${i}">${t.template_name}</option>`).join('');
      document.getElementById("staffSelect").innerHTML = '<option value="">選択</option>' + staffList.map((s,i)=>`<option value="${i}">${s.name}（${s.rank}）</option>`).join('');
    } catch (e) { console.error(e); }
  };

  function setupCalTitleSelect() {
    const tIdx = document.getElementById("tplSelect").value;
    const calSelect = document.getElementById("calTitleSelect");
    calSelect.innerHTML = "";
    if (tIdx !== "" && templates[tIdx].calendar_title) {
      const titles = templates[tIdx].calendar_title.split(',');
      if (titles.length > 1) {
        const placeholder = document.createElement("option");
        placeholder.value = ""; placeholder.textContent = "-- タイトルを選択してください --";
        calSelect.appendChild(placeholder);
      }
      titles.forEach(t => {
        const item = t.trim(); const opt = document.createElement("option");
        if (item.includes(":")) { const parts = item.split(":"); opt.textContent = parts[0].trim(); opt.value = parts[1].trim(); }
        else { opt.textContent = item; opt.value = item; }
        calSelect.appendChild(opt);
      });
    }
  }

  function update() {
    const tIdx = document.getElementById("tplSelect").value, sIdx = document.getElementById("staffSelect").value,
          lineName = document.getElementById("lineNameInput").value.trim(), rawText = document.getElementById("rawInput").value.trim(),
          selectedCalBase = document.getElementById("calTitleSelect").value;
    const tpl = templates[tIdx], staff = staffList[sIdx];
    
    // カレンダータイトル制御
    if (tpl && tpl.calendar_title) {
      document.getElementById("calBox").classList.remove("hidden");
      document.getElementById("calOutput").value = selectedCalBase ? `${selectedCalBase}${lineName}` : "";
    } else { document.getElementById("calBox").classList.add("hidden"); }

    // スレッド制御
    const threadBox = document.getElementById("threadBox");
    if (tpl && tpl.thread && tpl.thread.trim() !== "") {
      threadBox.classList.remove("hidden");
      let threadText = tpl.thread;
      const data = { userName: (rawText.match(/■お名前：\s*([^\n\r]+)/) || ["",""])[1].trim() };
      threadText = threadText.split('${userName}').join(data.userName);
      document.getElementById("threadOutput").value = threadText;
    } else { threadBox.classList.add("hidden"); }
    
    const isCalTitleSelected = (tpl && tpl.calendar_title) ? selectedCalBase !== "" : true;
    const allOk = (tIdx !== "" && sIdx !== "" && lineName !== "" && rawText !== "" && isCalTitleSelected);
    document.getElementById("mainCopyBtn").disabled = !allOk;
    
    if (allOk) {
      let body = tpl.body;
      const data = {
        userName: (rawText.match(/■お名前：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        eventDate: (rawText.match(/■日程：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        eventName: (rawText.match(/■イベント名：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        zoomLink: staff.zoom || "", memo: tpl.memo || ""
      };
      Object.keys(data).forEach(k => body = body.split(`\${${k}}`).join(data[k]));
      document.getElementById("resultOutput").value = body;
    } else { document.getElementById("resultOutput").value = ""; }
  }

  function copyText(id) { const el = document.getElementById(id); el.select(); document.execCommand("copy"); }
</script>
</body>
</html>
