<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カレンダー予約ツール</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; font-size: 13px; }
    .nav { margin-bottom: 10px; }
    .nav a { text-decoration: none; color: #007bff; font-weight: bold; }
    .container { max-width: 950px; margin: 0 auto; display: flex; gap: 15px; }
    .panel { flex: 1; border: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .btn-small { cursor: pointer; font-size: 10px; padding: 2px 5px; background: #eee; border: 1px solid #ccc; }
    .label { font-weight: bold; display: block; margin-top: 10px; }
    select, textarea, input { width: 100%; box-sizing: border-box; padding: 5px; margin-top: 3px; border: 1px solid #999; font-size: 14px; }
    #rawInput { height: 150px; }
    #resultOutput { flex-grow: 1; height: 300px; background: #f9f9f9; font-family: monospace; }
    .flex-row { display: flex; gap: 5px; margin-top: 3px; }
    .flex-row input { flex: 1; }
    .btn-copy { cursor: pointer; padding: 5px 10px; background: #eee; border: 1px solid #999; font-size: 11px; white-space: nowrap; }
    .btn-main { cursor: pointer; padding: 10px; width: 100%; margin-top: 10px; background: #333; color: #fff; border: none; font-weight: bold; }
    .btn-main:disabled { background: #ccc; }
    .hidden { display: none !important; }
    @media (max-width: 700px) { .container { flex-direction: column; } }
  </style>
</head>
<body>

<div class="nav"><a href="index.html">← インデックスに戻る</a></div>

<div class="container">
  <div class="panel">
    <div class="header-row"><strong>【入力】</strong><button class="btn-small" onclick="clearAllData()">クリア</button></div>
    <span class="label">1. テンプレート</span>
    <select id="tplSelect"><option value="">読込中...</option></select>
    <span class="label">2. 申し込み情報</span>
    <textarea id="rawInput" placeholder="貼り付けてください"></textarea>
    <span class="label">3. お客様LINE名 (必須)</span>
    <input type="text" id="lineNameInput" placeholder="例：田中太郎">
    <span class="label">4. セールス担当</span>
    <select id="staffSelect"></select>
  </div>

  <div class="panel">
    <strong>【出力】</strong>
    <div id="calBox" class="hidden">
      <span class="label">カレンダータイトル種別</span>
      <select id="calTitleSelect"></select>
      <span class="label">コピー用タイトル</span>
      <div class="flex-row">
        <input type="text" id="calOutput" readonly>
        <button class="btn-copy" onclick="copyText('calOutput')">コピー</button>
      </div>
    </div>
    <span class="label">本文</span>
    <textarea id="resultOutput" readonly></textarea>
    <button id="mainCopyBtn" class="btn-main" onclick="copyText('resultOutput')" disabled>本文をコピー</button>
  </div>
</div>

<script>
  const TPL_API = "https://script.google.com/macros/s/AKfycbwknNEj5910zohQL6xzbLnFPj5HqByNODhKvGAAE3yB4lpQ3aIjxVmVa0cmbkTTEk3V/exec";
  const STAFF_API = "https://script.google.com/macros/s/AKfycbySHVscjhTYWKf8bLJUGIMJ7AArbsp8cS8wl0O8FyYjYoO2mRzMO8jZhcc_cmhDvYfIhA/exec";
  let templates = [], staffList = [];

  window.onload = async () => {
    try {
      const [r1, r2] = await Promise.all([fetch(TPL_API).then(r=>r.json()), fetch(STAFF_API).then(r=>r.json())]);
      templates = r1; staffList = r2;
      document.getElementById("tplSelect").innerHTML = '<option value="">選択</option>' + templates.map((t,i)=>`<option value="${i}">${t.template_name}</option>`).join('');
      document.getElementById("staffSelect").innerHTML = '<option value="">選択</option>' + staffList.map((s,i)=>`<option value="${i}">${s.name}（${s.rank}）</option>`).join('');
      restoreData();
      update();
    } catch (e) { console.error(e); }
  };

  const fields = ["tplSelect", "rawInput", "lineNameInput", "staffSelect", "calTitleSelect"];
  fields.forEach(id => {
    document.getElementById(id).addEventListener("input", () => {
      localStorage.setItem('cr_' + id, document.getElementById(id).value);
      if(id === "tplSelect") setupCalTitleSelect();
      update();
    });
  });

  function setupCalTitleSelect() {
    const tIdx = document.getElementById("tplSelect").value;
    const calSelect = document.getElementById("calTitleSelect");
    calSelect.innerHTML = "";
    if (tIdx !== "" && templates[tIdx].calendar_title) {
      templates[tIdx].calendar_title.split(',').forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.trim(); opt.textContent = t.trim();
        calSelect.appendChild(opt);
      });
      const saved = localStorage.getItem('cr_calTitleSelect');
      if (saved) calSelect.value = saved;
    }
  }

  function restoreData() {
    fields.forEach(id => {
      const saved = localStorage.getItem('cr_' + id);
      if (saved !== null) document.getElementById(id).value = saved;
    });
    setupCalTitleSelect();
  }

  function update() {
    const tIdx = document.getElementById("tplSelect").value, sIdx = document.getElementById("staffSelect").value, 
          lineName = document.getElementById("lineNameInput").value.trim(), rawText = document.getElementById("rawInput").value.trim(),
          selectedCalBase = document.getElementById("calTitleSelect").value;
    const tpl = templates[tIdx], staff = staffList[sIdx];
    
    const calBox = document.getElementById("calBox");
    if (tpl && tpl.calendar_title) {
      calBox.classList.remove("hidden");
      document.getElementById("calOutput").value = `${selectedCalBase}_${lineName}`;
    } else { calBox.classList.add("hidden"); }
    
    const allOk = (tIdx !== "" && sIdx !== "" && lineName !== "" && rawText !== "");
    document.getElementById("mainCopyBtn").disabled = !allOk;
    if (allOk) {
      let body = tpl.body;
      const data = {
        userName: (rawText.match(/■お名前：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        eventDate: (rawText.match(/■日程：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        eventName: (rawText.match(/■イベント名：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        zoomLink: staff.zoom || "" 
      };
      Object.keys(data).forEach(k => body = body.split(`\${${k}}`).join(data[k]));
      document.getElementById("resultOutput").value = body;
    } else { document.getElementById("resultOutput").value = ""; }
  }

  function copyText(id) { const el = document.getElementById(id); el.select(); document.execCommand("copy"); }
  function clearAllData() { if (confirm("クリアしますか？")) { fields.forEach(id => localStorage.removeItem('cr_' + id)); location.reload(); } }
</script>
</body>
</html>
