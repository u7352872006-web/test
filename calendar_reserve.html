<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>カレンダー予約ツール</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 10px; font-size: 13px; color: #333; }
    .nav { margin-bottom: 10px; }
    .nav a { text-decoration: none; color: #007bff; font-weight: bold; }
    .container { max-width: 950px; margin: 0 auto; display: flex; gap: 15px; }
    .panel { flex: 1; border: 1px solid #ccc; padding: 10px; display: flex; flex-direction: column; min-width: 0; }
    .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
    .btn-small { cursor: pointer; font-size: 10px; padding: 2px 5px; background: #eee; border: 1px solid #ccc; border-radius: 3px; }
    .label { font-weight: bold; display: block; margin-top: 10px; }
    select, textarea, input { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; border: 1px solid #999; font-size: 14px; }
    
    /* 入力エリアの高さ */
    #rawInput { height: 120px; }
    #memoInput { height: 80px; background: #fffde7; } /* メモは少し色を変えて区別 */
    
    /* 出力エリアの高さ */
    #resultOutput { flex-grow: 1; height: 250px; background: #fff; font-family: monospace; }
    
    .flex-row { display: flex; gap: 5px; margin-top: 4px; }
    .flex-row input { flex: 1; }
    .btn-copy { cursor: pointer; padding: 5px 10px; background: #eee; border: 1px solid #999; font-size: 11px; white-space: nowrap; border-radius: 3px; }
    .btn-copy:hover { background: #e0e0e0; }
    
    .btn-main { cursor: pointer; padding: 12px; width: 100%; margin-top: 10px; background: #333; color: #fff; border: none; font-weight: bold; border-radius: 4px; }
    .btn-main:disabled { background: #ccc; cursor: not-allowed; }
    
    .hidden { display: none !important; }
    @media (max-width: 700px) { .container { flex-direction: column; } }
  </style>
</head>
<body>

<div class="nav"><a href="index.html">← インデックスに戻る</a></div>

<div class="container">
  <div class="panel">
    <div class="header-row">
      <strong>【入力エリア】</strong>
      <button class="btn-small" onclick="clearAllData()">すべての入力をクリア</button>
    </div>

    <span class="label">1. テンプレート選択</span>
    <select id="tplSelect"><option value="">読込中...</option></select>
    
    <span class="label">2. 申し込み情報</span>
    <div class="flex-row">
      <textarea id="rawInput" placeholder="ここに申し込みメール等を貼り付け"></textarea>
    </div>
    <div class="flex-row" style="justify-content: flex-end;">
      <button class="btn-copy" onclick="copyText('rawInput')">申し込み情報をコピー</button>
    </div>
    
    <span class="label">3. お客様LINE名 (必須)</span>
    <input type="text" id="lineNameInput" placeholder="例：田中太郎">
    
    <span class="label">4. セールス担当</span>
    <select id="staffSelect"></select>

    <span class="label">5. メモ (自分用)</span>
    <textarea id="memoInput" placeholder="自由なメモ書きに。これも保存されます"></textarea>
  </div>

  <div class="panel">
    <div class="header-row"><strong>【出力結果】</strong></div>
    
    <div id="calBox" class="hidden">
      <span class="label">カレンダータイトル種別</span>
      <select id="calTitleSelect"></select>
      
      <span class="label">カレンダー用コピータイトル（編集可）</span>
      <div class="flex-row">
        <input type="text" id="calOutput">
        <button class="btn-copy" onclick="copyText('calOutput')">コピー</button>
      </div>
    </div>

    <span class="label">生成された本文（自由に編集できます）</span>
    <textarea id="resultOutput" placeholder="入力が完了するとここに自動生成されます"></textarea>
    
    <button id="mainCopyBtn" class="btn-main" onclick="copyText('resultOutput')" disabled>本文をコピーする</button>
  </div>
</div>

<script>
  const TPL_API = "https://script.google.com/macros/s/AKfycbwknNEj5910zohQL6xzbLnFPj5HqByNODhKvGAAE3yB4lpQ3aIjxVmVa0cmbkTTEk3V/exec";
  const STAFF_API = "https://script.google.com/macros/s/AKfycbySHVscjhTYWKf8bLJUGIMJ7AArbsp8cS8wl0O8FyYjYoO2mRzMO8jZhcc_cmhDvYfIhA/exec";
  
  let templates = [], staffList = [];

  // 監視・保存対象のIDリスト
  const fields = ["tplSelect", "rawInput", "lineNameInput", "staffSelect", "calTitleSelect", "memoInput"];

  window.onload = async () => {
    try {
      const [r1, r2] = await Promise.all([
        fetch(TPL_API).then(r => r.json()),
        fetch(STAFF_API).then(r => r.json())
      ]);
      templates = r1;
      staffList = r2;

      // プルダウン初期化
      document.getElementById("tplSelect").innerHTML = '<option value="">選択してください</option>' + 
        templates.map((t, i) => `<option value="${i}">${t.template_name}</option>`).join('');
      
      document.getElementById("staffSelect").innerHTML = '<option value="">選択してください</option>' + 
        staffList.map((s, i) => `<option value="${i}">${s.name}（${s.rank}）</option>`).join('');

      // データ復元
      restoreData();
      update();
    } catch (e) {
      console.error("データの読み込みに失敗しました", e);
    }
  };

  // 各入力欄へのイベント設定
  fields.forEach(id => {
    const el = document.getElementById(id);
    const eventType = el.tagName === "SELECT" ? "change" : "input";
    
    el.addEventListener(eventType, () => {
      localStorage.setItem('cr_' + id, el.value);
      if(id === "tplSelect") setupCalTitleSelect();
      update();
    });
  });

  function setupCalTitleSelect() {
    const tIdx = document.getElementById("tplSelect").value;
    const calSelect = document.getElementById("calTitleSelect");
    calSelect.innerHTML = "";

    if (tIdx !== "" && templates[tIdx].calendar_title) {
      const titles = templates[tIdx].calendar_title.split(',');
      titles.forEach(t => {
        const opt = document.createElement("option");
        opt.value = t.trim(); opt.textContent = t.trim();
        calSelect.appendChild(opt);
      });
      const saved = localStorage.getItem('cr_calTitleSelect');
      if (saved) calSelect.value = saved;
    }
  }

  function restoreData() {
    fields.forEach(id => {
      const saved = localStorage.getItem('cr_' + id);
      if (saved !== null) document.getElementById(id).value = saved;
    });
    setupCalTitleSelect();
  }

  function update() {
    const tIdx = document.getElementById("tplSelect").value;
    const sIdx = document.getElementById("staffSelect").value;
    const lineName = document.getElementById("lineNameInput").value.trim();
    const rawText = document.getElementById("rawInput").value.trim();
    const selectedCalBase = document.getElementById("calTitleSelect").value;
    
    const tpl = templates[tIdx];
    const staff = staffList[sIdx];
    
    // カレンダータイトル表示制御
    const calBox = document.getElementById("calBox");
    if (tpl && tpl.calendar_title) {
      calBox.classList.remove("hidden");
      document.getElementById("calOutput").value = `${selectedCalBase}_${lineName}`;
    } else {
      calBox.classList.add("hidden");
    }
    
    // 本文生成
    const allOk = (tIdx !== "" && sIdx !== "" && lineName !== "" && rawText !== "");
    document.getElementById("mainCopyBtn").disabled = !allOk;
    
    if (allOk) {
      let body = tpl.body;
      const data = {
        userName: (rawText.match(/■お名前：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        eventDate: (rawText.match(/■日程：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        eventName: (rawText.match(/■イベント名：\s*([^\n\r]+)/) || ["",""])[1].trim(),
        zoomLink: staff.zoom || "" 
      };
      Object.keys(data).forEach(k => {
        body = body.split(`\${${k}}`).join(data[k]);
      });
      document.getElementById("resultOutput").value = body;
    } else {
      // 完全に消去せず、前回の編集内容を残したい場合はここを空にしない運用も可能です
    }
  }

  function copyText(id) {
    const el = document.getElementById(id);
    el.select();
    document.execCommand("copy");
    // コピーしたことがわかるように簡易アラート（お好みで）
    // alert("コピーしました");
  }

  function clearAllData() {
    if (confirm("メモを含むすべての入力を消去してリセットしますか？")) {
      fields.forEach(id => localStorage.removeItem('cr_' + id));
      location.reload();
    }
  }
</script>
</body>
</html>
