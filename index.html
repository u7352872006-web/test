<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>業務テンプレートツール</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>テンプレート文章作成ツール</h1>
      <p class="subtitle">スプレッドシート管理・自動入力対応</p>
    </header>

    <div class="card">
      <label for="templateSelect">使用するテンプレート</label>
      <select id="templateSelect">
        <option value="">テンプレートを読み込み中...</option>
      </select>
      <div id="templateMeta" class="meta-info"></div>
    </div>

    <div id="parserSection" class="card hidden">
      <div class="section-header">
        <h2>申し込みフォーム解析</h2>
        <button id="parseButton" class="btn btn-secondary">自動入力を実行</button>
      </div>
      <textarea id="formPasteText" placeholder="ここに申し込みフォームの本文を貼り付けてください"></textarea>
    </div>

    <div class="card">
      <div class="section-header">
        <h2>入力項目</h2>
        <button id="clearButton" class="btn btn-outline">クリア</button>
      </div>
      <div id="fieldsContainer">
        <p class="placeholder-text">テンプレートを選択してください</p>
      </div>
    </div>

    <div class="card">
      <div class="section-header">
        <h2>出力テキスト</h2>
        <button id="copyButton" class="btn btn-primary">コピー</button>
      </div>
      <textarea id="outputText" readonly placeholder="生成された文章がここに表示されます"></textarea>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
