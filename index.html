<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Support Tool</title>
  <style>
    /* 全体：スマホ・PC両対応。スクロールを妨げない */
    body { font-family: sans-serif; background: #f4f7f6; margin: 0; padding: 15px; color: #333; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: white; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    
    h3 { margin-top: 0; font-size: 15px; border-bottom: 1px solid #eee; padding-bottom: 10px; display: flex; justify-content: space-between; }
    .label { font-weight: bold; display: block; margin: 12px 0 5px; font-size: 13px; }
    
    select, textarea, input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
    textarea { height: 120px; font-family: monospace; }
    #resultOutput { height: 250px; background: #fafafa; }

    /* 各出力エリアの色分け */
    .out-cal { background: #e6f7ff !important; font-weight: bold; border-color: #91d5ff !important; }
    .out-thread { background: #f6ffed !important; font-weight: bold; border-color: #b7eb8f !important; }

    /* ボタン */
    .btn { cursor: pointer; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; font-size: 12px; }
    .btn-reset { background: #ff4d4f; color: white; }
    .btn-copy { background: #007bff; color: white; margin-top: 5px; }
    .btn-copy:disabled { background: #ccc; cursor: not-allowed; }
    
    .flex { display: flex; gap: 8px; align-items: center; margin-top: 5px; }
    .flex input { flex: 1; }
    
    .memo-box { background: #fffbe6; border: 1px solid #ffe58f; padding: 10px; font-size: 12px; margin-top: 10px; border-radius: 4px; }
    .hidden { display: none !important; }
    .required { border-left: 4px solid #ff4d4f; } /* 必須項目を目立たせる */
  </style>
</head>
<body>

<div class="container">
  
  <div class="card">
    <h3>設定入力 <button class="btn btn-reset" onclick="resetAll()">全リセット</button></h3>
    
    <span class="label">1. テンプレート選択</span>
    <select id="tplSelect" class="required"><option value="">読み込み中...</option></select>
    
    <span class="label">2. お客様のLINE名 (必須)</span>
    <input type="text" id="lineNameInput" class="required" placeholder="田中 太郎様">

    <span class="label">3. 申し込み情報ペースト</span>
    <textarea id="rawInput" placeholder="情報をここに貼り付け"></textarea>
    
    <span class="label">4. セールス担当選択</span>
    <select id="staffSelect" class="required"><option value="">選択してください</option></select>

    <div id="memoArea" class="memo-box">テンプレートを選択してください</div>
  </div>

  <div class="card">
    <h3>出力結果</h3>

    <div id="calBox" class="hidden">
      <span class="label">カレンダータイトル用</span>
      <div class="flex">
        <input type="text" id="calOutput" class="out-cal" readonly>
        <button class="btn btn-copy" onclick="copy(this, 'calOutput')">コピー</button>
      </div>
    </div>

    <div id="threadBox" class="hidden">
      <span class="label">スレッド用</span>
      <div class="flex">
        <input type="text" id="threadOutput" class="out-thread" readonly>
        <button class="btn btn-copy" onclick="copy(this, 'threadOutput')">コピー</button>
      </div>
    </div>

    <span class="label">本文</span>
    <textarea id="resultOutput" readonly placeholder="全項目を入力・選択してください"></textarea>
    <div style="text-align: right;">
      <button id="mainCopyBtn" class="btn btn-copy" style="padding: 12px 30px;" onclick="copy(this, 'resultOutput')" disabled>本文をコピー</button>
    </div>
  </div>

</div>

<script>
  // API URL
  const TPL_API = "https://script.google.com/macros/s/AKfycbwknNEj5910zohQL6xzbLnFPj5HqByNODhKvGAAE3yB4lpQ3aIjxVmVa0cmbkTTEk3V/exec";
  const STAFF_API = "https://script.google.com/macros/s/AKfycbySHVscjhTYWKf8bLJUGIMJ7AArbsp8cS8wl0O8FyYjYoO2mRzMO8jZhcc_cmhDvYfIhA/exec";
  
  let templates = [], staffList = [];

  window.onload = async () => {
    try {
      const [res1, res2] = await Promise.all([fetch(TPL_API).then(r=>r.json()), fetch(STAFF_API).then(r=>r.json())]);
      templates = res1; staffList = res2;
      document.getElementById("tplSelect").innerHTML = '<option value="">選択してください</option>' + templates.map((t,i)=>`<option value="${i}">${t.template_name}</option>`).join('');
      document.getElementById("staffSelect").innerHTML = '<option value="">選択してください</option>' + staffList.map((s,i)=>`<option value="${i}">${s.name}（${s.rank}）</option>`).join('');
    } catch (e) { alert("API読み込み失敗"); }
  };

  const rawInput = document.getElementById("rawInput");
  const tplSelect = document.getElementById("tplSelect");
  const staffSelect = document.getElementById("staffSelect");
  const lineNameInput = document.getElementById("lineNameInput");

  // 入力が変わったらリセット（安全のため）
  rawInput.addEventListener("input", () => { staffSelect.value = ""; update(); });
  tplSelect.addEventListener("change", update);
  staffSelect.addEventListener("change", update);
  lineNameInput.addEventListener("input", update);

  function resetAll() { if(confirm("クリアしますか？")) location.reload(); }

  function update() {
    const tIdx = tplSelect.value, sIdx = staffSelect.value, lineName = lineNameInput.value.trim(), rawText = rawInput.value.trim();
    const tpl = templates[tIdx];
    
    // 表示リセット
    document.getElementById("calBox").classList.add("hidden");
    document.getElementById("threadBox").classList.add("hidden");
    document.getElementById("memoArea").innerText = tpl ? (tpl.memo || "メモなし") : "テンプレートを選択してください";

    // 1. カレンダータイトルの処理
    if(tpl && tpl.calendar_title) {
      document.getElementById("calBox").classList.remove("hidden");
      document.getElementById("calOutput").value = `${tpl.calendar_title}_${lineName}`;
    }

    // 2. スレッドの処理（スプレッドシートの列名は "thread" と想定）
    if(tpl && tpl.thread) {
      document.getElementById("threadBox").classList.remove("hidden");
      document.getElementById("threadOutput").value = `${tpl.thread}${lineName}`;
    }

    // 3. 本文の生成とバリデーション
    const allOk = (tIdx !== "" && sIdx !== "" && lineName !== "" && rawText !== "");
    document.getElementById("mainCopyBtn").disabled = !allOk;

    if (!allOk) { document.getElementById("resultOutput").value = ""; return; }

    let body = tpl.body;
    const staff = staffList[sIdx];
    const data = {
      userName: (rawText.match(/■お名前：\s*([^\n\r]+)/) || ["",""])[1].trim(),
      eventDate: (rawText.match(/■日程：\s*([^\n\r]+)/) || ["",""])[1].trim(),
      eventName: (rawText.match(/■イベント名：\s*([^\n\r]+)/) || ["",""])[1].trim(),
      zoomLink: staff.zoom || "" 
    };
    Object.keys(data).forEach(k => body = body.replace(new RegExp(`\\$\\{${k}\\}`, "g"), data[k]));
    document.getElementById("resultOutput").value = body;
  }

  function copy(btn, id) {
    const el = document.getElementById(id);
    el.select(); document.execCommand("copy");
    const oldText = btn.textContent;
    btn.textContent = "OK!"; btn.style.background = "#28a745";
    setTimeout(() => { btn.textContent = oldText; btn.style.background = ""; }, 1000);
  }
</script>
</body>
</html>
